[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memreceipt"
version = "0.1.0"
description = "A load receipt for Claude Code auto-memory: what MEMORY.md actually loaded, what was cut, and which memories sessions ever open. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prime-agentai" }]
keywords = ["claude-code", "memory", "auto-memory", "agent-memory", "hooks", "anthropic", "ai-agents", "observability", "llm", "context"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
memreceipt = "memreceipt.cli:main"

[project.urls]
Homepage = "https://github.com/Prime-agentai/memreceipt"
Issues = "https://github.com/Prime-agentai/memreceipt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memreceipt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]
